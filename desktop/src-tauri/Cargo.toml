[package]
name = "helpervalley"
version = "0.1.1"
description = "Copies your Stardew Valley saves where the HelperValley website can read them"
authors = ["mauricioaires30"]
edition = "2021"
license = "MIT"

[lib]
name = "helpervalley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dunce = "1"
filetime = "0.2"
notify = "8"
notify-debouncer-full = "0.6"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
